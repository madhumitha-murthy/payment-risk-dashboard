spring.application.name=transaction-service
server.port=8082

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transactiondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:txuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:txpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Risk service URL
risk.service.url=${RISK_SERVICE_URL:http://risk-service:8083}

# Logging
logging.level.com.madhumitha=INFO
